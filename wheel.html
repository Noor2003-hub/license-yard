<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17191d">
<title>دركسيون ساحة الليسن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
:root{--asphalt:#17191d;--asphalt-2:#22252b;--asphalt-3:#2d3139;--paint:#f1eee6;--muted:#a2a7b0;--kerb:#f2c230;--go:#3cc07e;--stop:#d8382c;
  --display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;--body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--asphalt);color:var(--paint);font-family:var(--body);font-size:15px;line-height:1.55;overscroll-behavior:none;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-sizing:border-box;
  display:flex;flex-direction:column;gap:12px;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
.kerb{height:8px;background:repeating-linear-gradient(90deg,var(--kerb) 0 28px,#0c0d0f 28px 56px);border-radius:2px;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.5rem;margin:0}
.join{display:flex;gap:8px}
input{background:var(--asphalt-2);border:1px solid #444a55;border-radius:10px;color:var(--paint);font-size:1.3rem;width:6em;text-align:center;letter-spacing:.2em;padding:6px;font-family:var(--display);direction:ltr}
.btn{background:var(--kerb);color:#111;border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:1rem}
.btn.ghost{background:var(--asphalt-3);color:var(--paint)}
.main{flex:1;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;min-height:0}
#wheel{width:min(80vw,58vh,380px);aspect-ratio:1;touch-action:none;max-width:100%}
.side{display:flex;flex-direction:column;gap:10px;flex:1 1 220px;max-width:360px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;background:#666;flex:none}
.dot.on{background:var(--go);box-shadow:0 0 0 4px #3cc07e33}
.msg{color:var(--muted);font-size:.95rem}
.err{color:#ff8a7e}
.meter{height:10px;background:var(--asphalt-2);border-radius:5px;position:relative;overflow:hidden;direction:ltr}
.meter i{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--kerb)}
#start{position:fixed;inset:0;background:#0b0c0ef2;display:grid;place-items:center;padding:24px;text-align:center;z-index:5}
#start div{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:420px}
#start b{font-family:var(--display);font-size:1.6rem}
</style>
</head>
<body>
<div class="kerb"></div>
<div class="top">
  <h1>الدركسيون</h1>
  <div class="join"><input id="code" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="الكود اللي على اللابتوب"><button class="btn" id="joinBtn">اتصلي</button></div>
</div>
<div class="main">
  <svg id="wheel" viewBox="-110 -110 220 220" aria-label="الدركسيون">
    <g id="wheelG">
      <circle r="96" fill="none" stroke="#2d3139" stroke-width="22"/>
      <rect x="-8" y="-107" width="16" height="22" rx="4" fill="#f2c230"/>
      <path d="M-86 8 L-30 14 L-22 40 L22 40 L30 14 L86 8" fill="none" stroke="#2d3139" stroke-width="18" stroke-linejoin="round"/>
      <circle r="30" fill="#22252b" stroke="#3a3f48" stroke-width="2"/>
      <text y="7" text-anchor="middle" fill="#a2a7b0" font-size="16" font-family="Reem Kufi, sans-serif">تعليم</text>
    </g>
  </svg>
  <div class="side">
    <div class="row"><span class="dot" id="dot"></span><span id="link">مش متوصل</span></div>
    <div class="meter"><i id="bar"></i></div>
    <div class="msg" id="mode">ميلي التليفون يمين وشمال.</div>
    <div class="row">
      <button class="btn" id="centerBtn">سنتر</button>
      <button class="btn ghost" id="invBtn">اعكسي الاتجاه</button>
      <button class="btn ghost" id="fsBtn">ملء الشاشة</button>
    </div>
    <p class="msg">امسكي التليفون بالعرض وواقف قدامك زي الدركسيون، ودوسي "سنتر" وهو معدول. البنزين والفرامل على كيبورد اللابتوب.</p>
    <p class="msg err" id="err"></p>
  </div>
</div>
<div id="start"><div><b>جاهزة تسوقي؟</b><p class="msg">هنطلب إذن حساس الحركة عشان الميل يشتغل.</p><button class="btn" id="goBtn">ابدئي</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const normA=a=>{a%=Math.PI*2;if(a>Math.PI)a-=Math.PI*2;if(a<-Math.PI)a+=Math.PI*2;return a;};
const store={get(k,d){try{const v=localStorage.getItem('lyw_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('lyw_'+k,JSON.stringify(v));}catch(e){}}};
const W={s:0,mode:'tilt',inv:store.get('inv',false),center:null,gx:0,gy:0,got:false,wheelAng:0,peer:null,conn:null,code:null};
const qc=new URLSearchParams(location.search).get('c');
$('#code').value=(qc&&/^\d{4}$/.test(qc))?qc:store.get('code','');

function setLink(t,on){$('#link').textContent=t;$('#dot').classList.toggle('on',!!on);}
function onMotion(e){
  const g=e.accelerationIncludingGravity;if(!g||g.x==null||g.y==null)return;
  W.got=true;W.gx=W.gx*.6+g.x*.4;W.gy=W.gy*.6+g.y*.4;
  const ang=Math.atan2(W.gx,W.gy);
  if(W.center==null)W.center=ang;
  if(W.mode==='tilt'){let d=-normA(ang-W.center);if(W.inv)d=-d;W.s=clamp(d/(60*Math.PI/180),-1,1);}
}
async function enableTilt(){
  $('#err').textContent='';
  try{if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){const r=await DeviceMotionEvent.requestPermission();if(r!=='granted'){$('#err').textContent='محتاجين إذن الحركة عشان الميل يشتغل. افتحي الصفحة تاني ووافقي.';}}}catch(e){}
  window.addEventListener('devicemotion',onMotion);
  W.mode='tilt';W.center=null;
  $('#mode').textContent='الميل شغال. ميلي التليفون يمين وشمال.';
  setTimeout(()=>{if(!W.got){W.mode='touch';$('#mode').textContent='الحساس مش باعت حاجة. اتأكدي إن الصفحة مفتوحة بـ https، أو لفي الدركسيون بصباعك.';}},2500);
}
function connect(){
  const c=$('#code').value.trim();
  $('#err').textContent='';
  if(!/^\d{4}$/.test(c)){$('#err').textContent='اكتبي الكود اللي ظاهر على اللابتوب (٤ أرقام).';return;}
  W.code=c;store.set('code',c);
  if(!window.Peer){$('#err').textContent='مكتبة الاتصال ماتحملتش. اتأكدي من النت وحدثي الصفحة.';return;}
  setLink('بيتوصل…');
  const go=()=>{
    try{W.conn&&W.conn.close();}catch(e){}
    const conn=W.peer.connect('lyard-'+c,{reliable:false,serialization:'json'});W.conn=conn;
    conn.on('open',()=>setLink('متوصل باللابتوب',true));
    conn.on('close',()=>{setLink('اتفصل، بحاول تاني…');setTimeout(()=>{if(W.conn===conn)go();},1500);});
    conn.on('error',()=>{});
  };
  if(W.peer&&!W.peer.destroyed&&W.peer.open){go();return;}
  W.peer=new Peer({debug:0});
  W.peer.on('open',go);
  W.peer.on('disconnected',()=>{try{W.peer.reconnect();}catch(e){}});
  W.peer.on('error',e=>{
    if(e&&e.type==='peer-unavailable'){setLink('مش لاقية اللابتوب');$('#err').textContent='اتأكدي إن صفحة اللعبة مفتوحة على اللابتوب وإن الكود هو نفسه.';setTimeout(()=>{if(W.code===c)go();},3000);}
    else if(e&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error'))setLink('مشكلة في النت، بحاول تاني…');
  });
}
(function touch(){
  const el=$('#wheel');let act=false,last=0;
  const ang=e=>{const r=el.getBoundingClientRect();return Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)));};
  el.addEventListener('pointerdown',e=>{act=true;last=ang(e);if(W.mode!=='touch'){W.mode='touch';W.wheelAng=W.s*2.6;$('#mode').textContent='بتلفي بصباعك. دوسي "سنتر" عشان ترجعي للميل.';}try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!act)return;const a=ang(e);W.wheelAng=clamp(W.wheelAng+normA(a-last),-2.6,2.6);last=a;W.s=W.wheelAng/2.6;});
  const up=()=>{act=false;};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
})();
setInterval(()=>{if(W.conn&&W.conn.open){try{W.conn.send({s:Math.round(W.s*1000)/1000});}catch(e){}}},33);
(function draw(){
  $('#wheelG').setAttribute('transform',`rotate(${(W.s*150).toFixed(1)})`);
  const b=$('#bar');const p=Math.abs(W.s)*50;b.style.width=p+'%';b.style.left=(W.s<0?50-p:50)+'%';
  requestAnimationFrame(draw);
})();
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake();});
$('#goBtn').onclick=()=>{$('#start').hidden=true;enableTilt();wake();if($('#code').value)connect();else $('#code').focus();};
$('#joinBtn').onclick=connect;
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')connect();});
$('#centerBtn').onclick=()=>{W.center=null;W.wheelAng=0;if(W.mode==='touch'){W.mode=W.got?'tilt':'touch';W.s=0;}if(W.got)$('#mode').textContent='الميل شغال. ميلي التليفون يمين وشمال.';};
const invTxt=()=>$('#invBtn').textContent=W.inv?'الاتجاه معكوس':'اعكسي الاتجاه';invTxt();
$('#invBtn').onclick=()=>{W.inv=!W.inv;store.set('inv',W.inv);invTxt();};
$('#fsBtn').onclick=()=>{try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();p&&p.catch&&p.catch(()=>{});}catch(e){}};
})();
</script>
</body>
</html>
