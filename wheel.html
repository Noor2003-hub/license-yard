<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17191d">
<title>دركسيون ساحة الليسن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
:root{--asphalt:#17191d;--asphalt-2:#22252b;--asphalt-3:#2d3139;--paint:#f1eee6;--muted:#a2a7b0;--kerb:#f2c230;--go:#3cc07e;--stop:#d8382c;
  --display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;--body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--asphalt)}
body{color:var(--paint);font-family:var(--body);font-size:14px;line-height:1.5;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer}
/* the stage is always landscape: in portrait it is turned 90° so the phone is held sideways */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@media (orientation:portrait){
  #stage{inset:auto;top:0;left:100vw;width:100vh;height:100vw;transform:rotate(90deg);transform-origin:top left;
    padding:max(10px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-bottom))}
  @supports (height:100dvh){#stage{width:100dvh;height:100dvw;left:100dvw}}
}
.kerb{height:6px;background:repeating-linear-gradient(90deg,var(--kerb) 0 28px,#0c0d0f 28px 56px);border-radius:2px;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}
h1{font-family:var(--display);font-size:1.25rem;margin:0}
.join{display:flex;gap:6px;align-items:center}
input[type=text]{background:var(--asphalt-2);border:1px solid #444a55;border-radius:9px;color:var(--paint);font-size:1.1rem;width:5.2em;text-align:center;letter-spacing:.2em;padding:4px;font-family:var(--display);direction:ltr}
.btn{background:var(--kerb);color:#111;border:0;border-radius:9px;padding:8px 14px;font-weight:700;font-size:.95rem}
.btn.ghost{background:var(--asphalt-3);color:var(--paint)}
.main{flex:1;display:flex;flex-direction:row;align-items:center;gap:18px;min-height:0}
.wheelBox{height:100%;flex:none;display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:58%}
#wheel{height:100%;width:100%;touch-action:none}
.side{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0;max-height:100%;overflow:auto;touch-action:pan-y}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#666;flex:none}
.dot.on{background:var(--go);box-shadow:0 0 0 4px #3cc07e33}
.msg{color:var(--muted);font-size:.88rem;margin:0}
.err{color:#ff8a7e}
.meter{height:8px;background:var(--asphalt-2);border-radius:4px;position:relative;overflow:hidden;direction:ltr}
.meter i{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--kerb)}
.sens{display:flex;flex-direction:column;gap:2px;background:var(--asphalt-2);border-radius:10px;padding:8px 12px}
.sens label{display:flex;justify-content:space-between;font-weight:500}
.sens label b{font-family:var(--display);color:var(--kerb);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--kerb);direction:ltr;touch-action:pan-x}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;direction:ltr}
#start{position:absolute;inset:0;background:#0b0c0ef5;display:grid;place-items:center;padding:24px;text-align:center;z-index:5}
#start div{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:460px}
#start b{font-family:var(--display);font-size:1.5rem}
</style>
</head>
<body>
<div id="stage">
<div class="kerb"></div>
<div class="top">
  <h1>الدركسيون</h1>
  <div class="row" style="gap:6px"><span class="dot" id="dot"></span><span id="link">مش متوصل</span></div>
  <div class="join"><input type="text" id="code" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="الكود اللي على اللابتوب"><button class="btn" id="joinBtn">اتصلي</button></div>
</div>
<div class="main">
  <div class="wheelBox">
  <svg id="wheel" viewBox="-110 -110 220 220" aria-label="الدركسيون">
    <g id="wheelG">
      <circle r="96" fill="none" stroke="#2d3139" stroke-width="22"/>
      <rect x="-8" y="-107" width="16" height="22" rx="4" fill="#f2c230"/>
      <path d="M-86 8 L-30 14 L-22 40 L22 40 L30 14 L86 8" fill="none" stroke="#2d3139" stroke-width="18" stroke-linejoin="round"/>
      <circle r="30" fill="#22252b" stroke="#3a3f48" stroke-width="2"/>
      <text y="7" text-anchor="middle" fill="#a2a7b0" font-size="16" font-family="Reem Kufi, sans-serif">تعليم</text>
    </g>
  </svg>
  </div>
  <div class="side">
    <div class="meter"><i id="bar"></i></div>
    <div class="sens">
      <label for="sens">حساسية الدركسيون <b id="sensV">5</b></label>
      <input type="range" id="sens" min="1" max="10" step="1" value="5">
      <div class="ends"><span>هادي</span><span>سريع</span></div>
    </div>
    <div class="msg" id="mode">ميلي التليفون يمين وشمال.</div>
    <div class="row">
      <button class="btn" id="centerBtn">سنتر</button>
      <button class="btn ghost" id="invBtn">اعكسي الاتجاه</button>
      <button class="btn ghost" id="fsBtn">ملء الشاشة</button>
    </div>
    <p class="msg">امسكي التليفون بالعرض زي الدركسيون. لو العربية بتميل وانتي ماسكاه معدول، دوسي "سنتر". البنزين والفرامل على كيبورد اللابتوب.</p>
    <p class="msg err" id="err"></p>
  </div>
</div>
<div id="start"><div><b>جاهزة تسوقي؟</b><p class="msg">امسكي التليفون بالعرض. هنطلب إذن حساس الحركة عشان الميل يشتغل.</p><button class="btn" id="goBtn">ابدئي</button></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const DEG=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const normA=a=>{a%=Math.PI*2;if(a>Math.PI)a-=Math.PI*2;if(a<-Math.PI)a+=Math.PI*2;return a;};
const store={get(k,d){try{const v=localStorage.getItem('lyw_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('lyw_'+k,JSON.stringify(v));}catch(e){}}};
const W={s:0,raw:0,mode:'tilt',inv:store.get('inv',false),off:store.get('off',0),sens:store.get('sens',5),gx:0,gy:0,got:false,wheelAng:0,peer:null,conn:null,code:null};
const lockDeg=()=>95-W.sens*7; // 1 → 88°, 5 → 60°, 10 → 25° of tilt for full lock
const qc=new URLSearchParams(location.search).get('c');
$('#code').value=(qc&&/^\d{4}$/.test(qc))?qc:store.get('code','');
$('#sens').value=W.sens;$('#sensV').textContent=W.sens;

function setLink(t,on){$('#link').textContent=t;$('#dot').classList.toggle('on',!!on);}
/* Steering angle from gravity, measured for a phone held sideways.
   Uses only the device's own x/y axes, so it is the same whichever way the screen rotates. */
function onMotion(e){
  const g=e.accelerationIncludingGravity;if(!g||g.x==null||g.y==null)return;
  W.got=true;W.gx=W.gx*.6+g.x*.4;W.gy=W.gy*.6+g.y*.4;
  const sx=W.gx<0?-1:1;
  W.raw=Math.atan2(sx*W.gy,Math.abs(W.gx));
  if(W.mode==='tilt'){let d=normA(W.raw-W.off);if(W.inv)d=-d;W.s=clamp(d/(lockDeg()*DEG),-1,1);}
}
async function enableTilt(){
  $('#err').textContent='';
  try{if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){const r=await DeviceMotionEvent.requestPermission();if(r!=='granted'){$('#err').textContent='محتاجين إذن الحركة عشان الميل يشتغل. افتحي الصفحة تاني ووافقي.';}}}catch(e){}
  window.addEventListener('devicemotion',onMotion);
  W.mode='tilt';
  $('#mode').textContent='الميل شغال. ميلي التليفون يمين وشمال.';
  setTimeout(()=>{if(!W.got){W.mode='touch';$('#mode').textContent='الحساس مش باعت حاجة. اتأكدي إن الصفحة مفتوحة بـ https، أو لفي الدركسيون بصباعك.';}},2500);
}
function lockLandscape(){try{const p=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');p&&p.catch&&p.catch(()=>{});}catch(e){}}
function goFull(){try{const el=document.documentElement;const p=el.requestFullscreen&&el.requestFullscreen();if(p&&p.then)p.then(lockLandscape,()=>{});}catch(e){}}
function connect(){
  const c=$('#code').value.trim();
  $('#err').textContent='';
  if(!/^\d{4}$/.test(c)){$('#err').textContent='اكتبي الكود اللي ظاهر على اللابتوب (٤ أرقام).';return;}
  W.code=c;store.set('code',c);
  if(!window.Peer){$('#err').textContent='مكتبة الاتصال ماتحملتش. اتأكدي من النت وحدثي الصفحة.';return;}
  setLink('بيتوصل…');
  const go=()=>{
    try{W.conn&&W.conn.close();}catch(e){}
    const conn=W.peer.connect('lyard-'+c,{reliable:false,serialization:'json'});W.conn=conn;
    conn.on('open',()=>{setLink('متوصل باللابتوب',true);$('#err').textContent='';});
    conn.on('close',()=>{setLink('اتفصل، بحاول تاني…');setTimeout(()=>{if(W.conn===conn)go();},1500);});
    conn.on('error',()=>{});
  };
  if(W.peer&&!W.peer.destroyed&&W.peer.open){go();return;}
  W.peer=new Peer({debug:0});
  W.peer.on('open',go);
  W.peer.on('disconnected',()=>{try{W.peer.reconnect();}catch(e){}});
  W.peer.on('error',e=>{
    if(e&&e.type==='peer-unavailable'){setLink('مش لاقية اللابتوب');$('#err').textContent='اتأكدي إن صفحة اللعبة مفتوحة على اللابتوب وإن الكود هو نفسه.';setTimeout(()=>{if(W.code===c)go();},3000);}
    else if(e&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error'))setLink('مشكلة في النت، بحاول تاني…');
  });
}
(function touch(){
  const el=$('#wheel');let act=false,last=0;
  const ang=e=>{const r=el.getBoundingClientRect();return Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)));};
  el.addEventListener('pointerdown',e=>{act=true;last=ang(e);if(W.mode!=='touch'){W.mode='touch';W.wheelAng=W.s*2.6;$('#mode').textContent='بتلفي بصباعك. دوسي "سنتر" عشان ترجعي للميل.';}try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!act)return;const a=ang(e);W.wheelAng=clamp(W.wheelAng+normA(a-last),-2.6,2.6);last=a;W.s=W.wheelAng/2.6;});
  const up=()=>{act=false;};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
})();
setInterval(()=>{if(W.conn&&W.conn.open){try{W.conn.send({s:Math.round(W.s*1000)/1000});}catch(e){}}},33);
(function draw(){
  $('#wheelG').setAttribute('transform',`rotate(${(W.s*150).toFixed(1)})`);
  const b=$('#bar');const p=Math.abs(W.s)*50;b.style.width=p+'%';b.style.left=(W.s<0?50-p:50)+'%';
  requestAnimationFrame(draw);
})();
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake();});
$('#goBtn').onclick=()=>{$('#start').hidden=true;goFull();enableTilt();wake();if($('#code').value)connect();else $('#code').focus();};
$('#joinBtn').onclick=connect;
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')connect();});
$('#centerBtn').onclick=()=>{
  W.wheelAng=0;
  if(W.got){W.off=W.raw;store.set('off',W.off);W.mode='tilt';$('#mode').textContent='اتعمل سنتر. ميلي التليفون يمين وشمال.';}
  else W.s=0;
};
$('#sens').addEventListener('input',e=>{W.sens=+e.target.value;$('#sensV').textContent=W.sens;store.set('sens',W.sens);});
const invTxt=()=>$('#invBtn').textContent=W.inv?'الاتجاه معكوس':'اعكسي الاتجاه';invTxt();
$('#invBtn').onclick=()=>{W.inv=!W.inv;store.set('inv',W.inv);invTxt();};
$('#fsBtn').onclick=goFull;
})();
</script>
</body>
</html>
